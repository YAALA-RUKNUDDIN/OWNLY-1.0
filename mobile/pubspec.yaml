name: ownly
description: OWNLY — your personal digital ownership assistant.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  mockito: ^5.4.4
  build_runner_core: ^7.3.0

flutter:
  uses-material-design: true