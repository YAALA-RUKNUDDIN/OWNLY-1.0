services:
  postgres:
    image: postgres:16-alpine
    container_name: ownly-postgres
    environment:
      POSTGRES_USER: ownly
      POSTGRES_PASSWORD: ownly_secret
      POSTGRES_DB: ownly
    ports:
      # Host port 5433 avoids conflict with native PostgreSQL on Windows/macOS.
      # Inside Docker network, services communicate via standard 5432.
      - "5433:5432"
    volumes:
      - ownly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownly"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ownly-redis
    ports:
      - "6379:6379"
    volumes:
      - ownly_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ownly-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://ownly:ownly_secret@postgres:5432/ownly
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ownly_production_secret_key_minimum_32_characters_random
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
      OCR_PROVIDER: tesseract
      PUSH_PROVIDER: noop
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ownly_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ownly-scheduler
    command: python -m app.workers.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg2://ownly:ownly_secret@postgres:5432/ownly
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ownly_production_secret_key_minimum_32_characters_random
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
      PUSH_PROVIDER: noop
      ENVIRONMENT: production
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ownly_storage:/app/storage
    restart: unless-stopped

volumes:
  ownly_pgdata:
  ownly_redisdata:
  ownly_storage:
