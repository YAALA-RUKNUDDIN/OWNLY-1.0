services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ownly
      POSTGRES_PASSWORD: ownly_secret
      POSTGRES_DB: ownly
    ports:
      # Host port 5433 avoids clashing with a native Windows PostgreSQL
      # service that may also listen on 5432 (see docs/decisions/D-006).
      - "5433:5432"
    volumes:
      - ownly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ownly_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ownly_pgdata:
  ownly_redisdata: